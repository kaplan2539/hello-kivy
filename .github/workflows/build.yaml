name: ci

on:
  push:

jobs:
  build-in-docker:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kaplan2539/p4a-container
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}

    permissions:
        contents: read
#        packages: write
#        attestations: write
#        id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/python-for-android
            ~/.gradle
          key: p4a-${{ runner.os }}-cache

      - name: Run python-for-android
        run: |
          p4a apk \
            --private src \
            --name hello_kivy \
            --dist_name hello_kivy \
            --package de.deac0.hello_kivy \
            --version 0.1 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy \
            --arch=armeabi-v7a

      - name: Generate GitHub Pages
        run: |
          mkdir -p pages_out
          rm -rf pages_out/*
          cp hello_kivy-debug-0.1.apk pages_out/
          sudo apt update
          sudo apt install -y qrencode
          echo 'https://d.eadc0.de/hello-kivy/hello_kivy-debug-0.1.apk' | qrencode -o pages_out/qr.png -t PNG
          cat > pages_out/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Download hello_kivy</title>
              <style>
                * {
                  box-sizing: border-box;
                }

                body {
                  margin: 0;
                  min-height: 100vh;
                  min-height: 100svh;
                  padding: 1rem;
                  background: #f3f5f8;
                  color: #172033;
                  font-family: system-ui, sans-serif;
                }

                main {
                  width: min(100%, 32rem);
                  margin: 0 auto;
                  padding: 1.25rem;
                  border-radius: 1rem;
                  background: #fff;
                  text-align: center;
                  box-shadow: 0 0.5rem 2rem rgb(23 32 51 / 10%);
                }

                h1 {
                  margin: 0 0 0.5rem;
                  font-size: clamp(1.5rem, 6vw, 2rem);
                }

                p {
                  margin: 0 0 1rem;
                  line-height: 1.5;
                }

                img {
                  display: block;
                  width: min(100%, 20rem);
                  max-height: 60svh;
                  margin: 1rem auto;
                  object-fit: contain;
                }

                a {
                  display: inline-block;
                  padding: 0.75rem 1rem;
                  border-radius: 0.5rem;
                  background: #1456c0;
                  color: #fff;
                  font-weight: 600;
                  text-decoration: none;
                }

                a:focus-visible {
                  outline: 3px solid #172033;
                  outline-offset: 3px;
                }

                @media (orientation: landscape) {
                  body {
                    display: grid;
                    place-items: center;
                  }
                }
              </style>
            </head>
            <body>
              <main>
                <h1>Download hello_kivy</h1>
                <p>Scan the QR code or use the download link.</p>
                <img src="qr.png" alt="QR code linking to the hello_kivy APK">
                <a href="https://d.eadc0.de/hello-kivy/hello_kivy-debug-0.1.apk">Download APK</a>
              </main>
            </body>
          </html>
          EOF

      - name: Archive binary
        id: archive-binary
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: hello_kivy-debug-0.1.apk

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_out

# Deploy job
  deploy:
    # Add a dependency to the build job
    needs: build-in-docker

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
